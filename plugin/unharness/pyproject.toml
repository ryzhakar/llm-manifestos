[project]
name = "unharness"
version = "4.1.0"
description = "Compile a manifesto stack into a session's system prompt and launch Claude Code with it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur Ryzhak" }]
keywords = ["claude-code", "system-prompt", "manifesto"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/ryzhakar/llm-manifestos"
Repository = "https://github.com/ryzhakar/llm-manifestos"
Documentation = "https://github.com/ryzhakar/llm-manifestos/blob/v4.1.0/plugin/unharness/README.md"

[project.scripts]
unharness = "unharness.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
